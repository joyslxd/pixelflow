# PixelFlow 生产环境配置。
# 启动示例：cd backend && PIXELFLOW_CONFIG_ENV=prod make gateway
# 说明：这里仍然直接写明文值；部署前请把 token、数据库和模型 key 改成你自己的真实值。

# 配置文件版本；用于后续升级配置结构时做兼容提示。
config_version: 1

# 日志级别；生产环境建议 info，异常排查期间再临时改成 debug。
log_level: info

# FastAPI 网关配置；可以类比 Spring Boot 的 server.* 配置。
gateway:
  # 网关监听地址；0.0.0.0 表示容器或服务器所有网卡都能访问。
  host: "0.0.0.0"
  # 网关监听端口；生产可按 nginx/网关转发端口调整。
  port: 8001
  # 是否开启 OpenAPI/Swagger 接口文档；生产默认关闭，避免接口面暴露。
  enable_docs: false
  # 允许跨域访问的正式前端域名；上线后改成你的真实域名，多个用英文逗号分隔。
  cors_origins: ""

# PixelFlow 业务配置；对应短视频生成 Agent 自己的 Service/Client 参数。
pixelflow:
  # M13.1/R1 生产配置保持关闭；预算结构仍与开发环境一致，避免后续启用时回落到旧档案。
  agent_runtime:
    # 用途：选择新对话 Runtime 模式；枚举值，生产默认 off。
    # 修改后需重启且只影响新对话；未经发布批准不得开启，回滚为 off。
    # 影响：off 保持现有生产 v2 流程；该项不是敏感值。
    mode: "off"
    # 用途：限定 primary 接管的业务 intent；数组，生产默认空。
    # 修改后需重启且只影响新对话；当前不得增加取值，回滚为空数组。
    # 影响：空数组不允许 Runtime 接管图片、视频、PPT 或视频分析；非敏感值。
    enabled_intents: []
    # 用途：设置新建对话接入 Runtime 的比例；0-100 整数，生产默认 0。
    # 修改后需重启且只影响新对话；未经发布批准不得调大，回滚为 0。
    # 影响：0 表示全部生产新对话继续现有 v2 流程；非敏感值。
    new_conversation_rollout_percent: 0
    # 用途：控制上下文压缩、排队与恢复；布尔值，生产默认 false。
    # 修改后需重启且只影响新对话；未经发布批准不得开启，回滚为 false。
    # 影响：false 时生产不会启动新 Runtime 压缩流程；非敏感值。
    context_compaction_enabled: false
    # 统一上下文预算；与开发环境保持相同结构，启用后所有当前和未来 Agent 节点共用。
    context_budget:
      # 用途：设置统一有效上下文窗口；整数，单位 K，1K=1024 tokens，默认 896，
      # 必须大于两项预留之和。修改后需重启，只影响新进程中的模型调用和新压缩判断；
      # 运行中任务沿用启动快照；回滚时恢复 896。该项不是敏感值。
      # 影响：896 对应 917504 tokens，并受模型已验证的 1000000 tokens 物理上限约束。
      effective_context_k: 896
      # 用途：预留单次模型输出空间；正整数，单位 K，1K=1024 tokens，默认 32。
      # 修改后需重启，只影响新进程中的预算；调大将减少可用输入，回滚时恢复 32。
      # 影响：32 对应 32768 tokens，所有 Agent 节点使用相同输出预留；该项不是敏感值。
      output_reserve_k: 32
      # 用途：预留协议开销、估算误差和供应商波动空间；正整数，单位 K，默认 32。
      # 修改后需重启，只影响新进程中的预算；调大将更早压缩，回滚时恢复 32。
      # 影响：32 对应 32768 tokens，所有 Agent 节点使用相同安全预留；该项不是敏感值。
      safety_reserve_k: 32
      # 用途：要求实际模型存在当前有效且已验证的 context_profile；布尔值，默认 true。
      # 修改后需重启并影响新进程全部调用；false 会允许底层兼容性 128K 档案，回滚应保持 true。
      # 影响：true 时缺失、未验证或过期档案会启动失败，防止实际流程静默降级；该项不是敏感值。
      require_verified_model_profile: true
    # 用途：设置压缩失败后允许再次执行的最短间隔；正整数，单位秒，默认 30。
    # 修改后需重启，只影响之后新产生的失败租约；运行中已有租约保留持久化时间；
    # 回滚时恢复 30。影响：退避期内 Snapshot、SSE 和轮询只读状态，不制造重试风暴；非敏感值。
    compaction_retry_backoff_seconds: 30
  # PixelFlow 独立业务库 MySQL 连接串；生产建议填写真实 MySQL，留空则复用 DeerFlow 存储。
  mysql_url: ""
  # 是否启用 mem0 记忆能力；生产需要确认依赖和成本后再开启。
  mem0_enabled: false
  # 语义记忆能力；当前第一版使用 PowerMem HTTP sidecar。
  semantic_memory_enabled: true
  semantic_memory_provider: "powermem"
  # 生产环境 PowerMem 与 PixelFlow 同机部署，仅走本机回环地址，不暴露到公网。
  powermem_base_url: "http://127.0.0.1:18848"
  # PowerMem API Key；必须和 PowerMem 服务端 POWERMEM_AUTH_ENABLED/POWERMEM_API_KEYS 保持一致。
  powermem_api_key: "Lnzw114qV0ibwmUFyKIDcW8BhBm0rxtZ7r8p72G3G6xhxn_KTaAPAHNs5pzY1tbc"
  # 单次 PowerMem HTTP 超时，单位秒；只用于 search/health 等「同步在请求路径上」的调用，
  # 失败开放、不阻塞主创作流程。record 写入不共用这个值，避免被 3s 误杀。
  powermem_timeout_seconds: 3
  # record 写入专用超时，单位秒。record 全部走后台 asyncio.create_task，不在用户请求路径上，
  # 因此可以给得更宽松：preference 类记录会用 infer=true，服务端要做 DeepSeek LLM 抽取（实测约 36s）。
  # 默认 60s，避免中文偏好抽取被中途打断。
  powermem_record_timeout_seconds: 60
  # 每个 Agent 阶段默认取回的语义记忆条数。
  powermem_search_limit: 5
  # 是否允许 PixelFlow 写入 PowerMem；排查时可临时关闭只读。
  powermem_write_enabled: true
  # true 表示 PowerMem 不可用时主流程继续，仅记录 warning。
  powermem_fail_open: true
  # 媒体生成/理解供应商；当前仅支持 borgrise。
  # 目前图片生成、视频生成、参考视频拆解都走 Borgrise/content-app 接口。
  # 后续如果图片、视频、拆解需要拆成不同供应商，再新增 image_skill/video_skill/decompose_skill 等细分配置。
  media_skill: "borgrise"
  # 剪辑能力实现；生产默认用 jianying 生成剪映草稿，需要直出 mp4 可改成 ffmpeg。
  edit_skill: "jianying"
  # 剪映草稿输出目录；生产建议改成有容量保障的持久化目录。
  draft_root: "../drafts"
  # FFmpeg 成片输出目录；生产建议改成有容量保障的持久化目录。
  render_root: "../renders"
  # FFmpeg 字幕/花字字体文件路径；需要字幕渲染时填写服务器上的字体路径。
  caption_font: "../aption"
  # 第三方剪映草稿 Provider；测试与生产当前使用同一服务地址。
  jianying_draft_enabled: true
  jianying_draft_base_url: "https://s4b29nq5dvu0jtq75uj1h.apigateway-cn-shanghai.volceapi.com"
  # 第三方剪映草稿接口固定鉴权 token，会写入请求 Header 的 token 字段。
  jianying_draft_token: "79ddb1ca49342b32a1eba57057672129"
  # 前端轮询建议间隔，单位秒。
  jianying_draft_poll_interval_seconds: 2
  # 单个剪映草稿任务最大等待时间，单位秒。
  jianying_draft_timeout_seconds: 1800
  # 网络异常或 HTTP 5xx 的最大重试次数；业务 code 非 200 不自动重试。
  jianying_draft_max_retries: 2
  # 与第三方剪映草稿服务建立 HTTP 连接的超时时间，单位秒。
  jianying_draft_connect_timeout_seconds: 5
  # 调用第三方创建剪映草稿任务接口后的响应读取超时时间，单位秒。
  jianying_draft_create_read_timeout_seconds: 30
  # 轮询第三方剪映草稿任务结果接口时，单次响应读取超时时间，单位秒。
  jianying_draft_query_read_timeout_seconds: 15

# Borgrise 媒体生成供应商配置；当 pixelflow.media_skill=borgrise 时生效。
# 可以类比 Java 里某个 Feign/HTTP Client 的专属配置。
borgrise:
  # Borgrise/content-app API 基础地址；代码会用它调用生成接口，也会自动拼接 /auth/verify 做登录态校验。
  base_url: "https://video.borgrise.com/api"
  # 是否调用 Borgrise/content-app 的 /api/auth/verify 校验 Authorization。
  # 生产环境必须保持 true，不能关闭；关闭后无法立即感知 token 失效或用户禁用。
  remote_verify_enabled: true
  # 登录态校验接口超时时间，单位秒；只影响 /api/auth/verify。
  # 它只是一次短 HTTP 校验，不是生成任务轮询，所以生产环境默认 10 秒。
  verify_timeout_seconds: 10
  # 不配置用户 token：生成/查询接口会透传前端请求里的 content-app Authorization。
  # 是否跳过 SSL 证书校验；生产环境建议保持 false。
  skip_ssl_verify: false
  # 视频生成轮询超时时间，单位秒；视频生成可能较慢，默认最多等 1 小时。
  video_poll_timeout: 3600
  # 视频合并接口是 content-app 同步合并并上传，长视频合并可能超过普通 HTTP 读超时，默认最多等 1 小时。
  video_merge_request_timeout: 3600
  # 图片生成轮询超时时间，单位秒；图片通常比视频快，默认最多等 10 分钟。
  image_poll_timeout: 600
  # 视频分析/参考视频拆解轮询超时时间，单位秒；默认最多等 15 分钟。
  video_analysis_poll_timeout: 900
  # 第三方请求失败后的最大重试次数；生产稍微多重试一次。
  max_retries: 4

# DeerFlow harness 运行路径配置；可以类比平台框架的基础设施配置。
deerflow:
  # 当前运行环境名称；会写入 DEER_FLOW_ENV，便于日志/追踪区分环境。
  environment: "prod"
  # DeerFlow 可写数据目录；生产建议放到持久化磁盘。
  home: "../.deer-flow"
  # DeerFlow 项目根目录；留空时加载器默认设为当前配置文件所在的 backend 目录。
  project_root: ""
  # Docker/宿主机场景下的可见数据目录；本地裸进程部署可留空。
  host_base_dir: ""
  # 宿主机上的 skills 目录；容器挂载 skills 时填写。
  host_skills_path: ""
  # skills 目录；相对路径会按项目根目录解析。
  skills_path: "skills"
  # MCP/skills 扩展配置 JSON 路径；留空时自动查找 extensions_config.json/mcp_config.json。
  extensions_config_path: ""
  # sandbox 服务绑定地址；只在 AioSandbox/Docker sandbox 场景需要。
  sandbox_bind_host: ""
  # sandbox 对外访问主机名；只在 AioSandbox/Docker sandbox 场景需要。
  sandbox_host: ""

# LLM 模型配置；DeerFlow Agent 使用。这里直接写明文值，不再依赖 .env。
models:
  # 默认聊天模型；代码未显式指定 model_name 时会使用列表中的第一个模型。
  - name: "deepseek-v4-pro"
    # LangChain 模型 Provider 类路径；DeepSeek 兼容 OpenAI 协议，所以使用 ChatOpenAI 适配器。
    use: "langchain_openai:ChatOpenAI"
    # 实际请求给模型供应商的模型名称；需要和供应商控制台支持的名称一致。
    model: "deepseek-v4-pro-202606"
    # 模型 API Key；生产请填写真实明文 key。
    api_key: "sk-168bc06b8049ecaf15e49519a02ac34f"
    # 模型 API Base；这里使用 yunwu.site 的 OpenAI 兼容接口地址。
    base_url: "https://chaomengai.com/v1"
    # 已验证模型上下文能力档案；Runtime 严格模式只接受本档案，不使用 128K 兼容兜底。
    context_profile:
      # 用途：声明模型物理上下文窗口；正整数，单位 tokens，默认按本档案 1000000。
      # 修改后需重启并影响新进程全部 Agent 调用；只能填供应商已确认值，回滚恢复 1000000。
      # 影响：统一 917504 tokens 有效窗口不得超过该上限；非敏感值，来源见 source。
      max_context_tokens: 1000000
      # 用途：声明模型单次最大输出能力；正整数，单位 tokens，本档案取 32768。
      # 修改后需重启；必须小于 max_context_tokens，回滚恢复 32768。
      # 影响：Runtime 输出预留还会与该值取较小值；非敏感值，来源见 source。
      max_output_tokens: 32768
      # 用途：声明 Token 估算策略；字符串，当前使用 conservative_estimate。
      # 修改后需重启并影响新预算估算；无可靠 tokenizer 前不要改，回滚恢复该值。
      # 影响：按保守估算触发压缩以降低溢出风险；非敏感值。
      tokenizer_strategy: "conservative_estimate"
      # 用途：记录能力档案验证时间；带时区的 ISO-8601 字符串。
      # 修改后需重启；只应在重新验证供应商能力后更新，回滚恢复本次记录。
      # 影响：未来时间会被视为未验证并拒绝启动；非敏感值。
      verified_at: "2026-07-26T00:00:00+08:00"
      # 用途：记录模型能力证据来源；非空字符串，变更时需同步验证记录。
      # 修改后需重启；不改变数值但用于审计，回滚恢复本次说明。
      # 影响：空值会被视为未验证并拒绝实际流程启动；不得填写 token、密钥或账号。
      source: "AIRouter DeepSeek V4 Pro 1M 上下文能力确认"

# sandbox 配置；Agent 工具执行环境，类似受控的远程执行容器/本地执行器。
sandbox:
  # sandbox Provider；生产默认仍用本地 Provider，若需要容器隔离可切到 AioSandboxProvider。
  use: "deerflow.sandbox.local:LocalSandboxProvider"
  # 是否允许工具直接执行宿主机 bash；生产建议保持 false。
  allow_host_bash: false
  # bash 工具输出最大字符数；防止一次命令输出过大拖慢页面。
  bash_output_max_chars: 20000
  # 读文件工具输出最大字符数；防止超大文件把上下文撑爆。
  read_file_output_max_chars: 50000
  # ls 工具输出最大字符数；防止目录太大时输出失控。
  ls_output_max_chars: 20000

# DeerFlow 持久化配置；保存线程、运行记录、checkpointer 等平台数据。
database:
  # 持久化后端；生产单机可用 sqlite，多实例建议改 postgres。
  backend: "sqlite"
  # sqlite 数据目录；最终文件是 /data/pixelflow/.deer-flow/prod-data/deerflow.db。
  sqlite_dir: "../.deer-flow/prod-data"
  # PostgreSQL 连接串；当 backend=postgres 时填写真实生产连接串。
  postgres_url: ""
  # 是否打印 SQL；生产建议 false，避免日志过大。
  echo_sql: false
  # PostgreSQL 连接池大小；按生产并发量调整。
  pool_size: 10

# 自定义 Agent 管理 API 配置；生产默认开启，如不需要可关闭。
agents_api:
  # 是否启用自定义 Agent 管理 API。
  enabled: true

# 技能存储配置；DeerFlow skills 会从这里读取。
skills:
  # SkillStorage 实现类；默认本地文件存储。
  use: "deerflow.skills.storage.local_skill_storage:LocalSkillStorage"
  # skills 目录；相对项目根目录解析。
  path: "skills"
  # sandbox 内挂载 skills 的路径；容器场景可按挂载点调整。
  container_path: "/mnt/skills"

# 链路追踪配置；用于接入 LangSmith/Langfuse 观察 LLM 和工具调用。
tracing:
  # LangSmith 追踪配置。
  langsmith:
    # 是否启用 LangSmith；生产需要观测时改 true。
    enabled: false
    # LangSmith API Key；启用时填写真实明文 key。
    api_key: ""
    # LangSmith 项目名；用于在平台上区分项目。
    project: "pixelflow-prod"
    # LangSmith 服务地址；通常保持默认。
    endpoint: "https://api.smith.langchain.com"
  # Langfuse 追踪配置。
  langfuse:
    # 是否启用 Langfuse；生产需要观测时改 true。
    enabled: false
    # Langfuse Public Key；启用时填写真实明文 key。
    public_key: ""
    # Langfuse Secret Key；启用时填写真实明文 key。
    secret_key: ""
    # Langfuse 服务地址；自建时改成自己的地址。
    base_url: "https://cloud.langfuse.com"

# 常见第三方工具 Key；大模型 key 请直接写到 models.* 的 api_key/base_url。
third_party:
  # Serper 搜索 API Key；使用 Google 搜索工具时填写。
  serper_api_key: ""
  # Jina API Key；使用 Jina 读取网页/搜索能力时填写。
  jina_api_key: ""
  # InfoQuest API Key；使用 InfoQuest 检索能力时填写。
  infoquest_api_key: ""

# 环境变量直通区；少量非常规 key 可以放这里，加载器会原样写入 os.environ。
environment:
  # 自定义环境变量字典；key 必须是环境变量名，value 会转成字符串。
  variables: {}

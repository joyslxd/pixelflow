# PixelFlow 生产环境配置；所有 Secret 仅从部署环境或 Secret Manager 注入。
config_version: 2 # 用途：标识新 Harness 配置结构；影响：旧 DeerFlow 配置不再被加载。

gateway:
  host: "0.0.0.0" # 用途：设置 Gateway 监听地址；影响：由反向代理向用户暴露服务。
  port: 8001 # 用途：设置 Gateway 端口；影响：部署编排应将流量转发到此端口。
  enable_docs: false # 用途：控制 OpenAPI 文档；影响：生产默认关闭公开文档。
  cors_origins: "" # 用途：限定跨域来源；影响：空值代表同源部署，跨域必须由环境覆盖。

database:
  backend: "sqlite" # 用途：选择生产持久化后端；影响：首个 Sidecar 部署使用本机持久卷，不依赖未部署的 PostgreSQL。
  sqlite_dir: "/var/lib/pixelflow-gateway" # 用途：设置 Gateway SQLite 数据目录；影响：容器必须挂载该持久卷，否则重建会丢失会话和 Tool Ledger。
  url: "" # 用途：可选覆盖完整数据库 URL；影响：留空时由 sqlite_dir 生成连接地址。
  echo_sql: false # 用途：控制 SQL 日志；影响：生产保持 false，避免日志泄露业务数据。
  pool_size: 5 # 用途：设置非 SQLite 连接池基础大小；影响：当前 SQLite 部署不使用该值，切换数据库时才生效。

harness:
  sidecar_base_url: "" # 用途：配置 Linux Sidecar HTTPS 地址；影响：真实值由部署环境注入，缺失时 Gateway 停收新 Run。
  gateway_instance_id: "pixelflow-gateway" # 用途：标识 Gateway 实例；影响：写入服务 JWT 审计 claim。
  request_timeout_seconds: 15 # 用途：限制 Sidecar 请求秒数；影响：超时后触发准入关闭保护。

pixelflow:
  mysql_url: "" # 用途：兼容既有 MySQL 任务库 URL；影响：生产新架构优先使用 database.url。
  long_term_memory_enabled: true # 用途：控制长期记忆读写；影响：关闭后不检索或写入 Mem0。
  volcengine_mem0_base_url: "" # 用途：配置 Mem0 HTTPS 地址；影响：真实值仅从部署环境注入。
  volcengine_mem0_api_key: "" # 用途：预留 Mem0 密钥字段；影响：YAML 不存 Secret，缺失时远程记忆 fail-open。
  long_term_memory_timeout_seconds: 3 # 用途：限制 Mem0 检索秒数；影响：超时返回空记忆投影。
  long_term_memory_search_limit: 5 # 用途：限制记忆注入条数；影响：限制上下文增长。
  jianying_draft_enabled: false # 用途：控制已下线草稿 Provider；影响：保持 false，禁止旧交付路径重启。
  content_app_internal_upload_enabled: false # 用途：控制内部上传兼容开关；影响：保持 false，禁止旧 Provider 恢复。

content_app:
  base_url: "" # 用途：配置 content-app HTTPS 地址；影响：真实值必须由部署 Secret 注入。
  remote_verify_enabled: true # 用途：控制远端用户鉴权；影响：true 时拒绝无效登录态。
  verify_timeout_seconds: 10 # 用途：限制鉴权等待秒数；影响：超时 fail-closed。
  skip_ssl_verify: false # 用途：控制 TLS 校验；影响：生产必须保持 false。

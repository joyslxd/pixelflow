# PixelFlow 开发环境配置；敏感值必须通过进程环境或部署 Secret 注入。
config_version: 2 # 用途：标识新 Harness 配置结构；影响：旧 DeerFlow 配置不再被加载。

gateway:
  host: "0.0.0.0" # 用途：设置 Gateway 监听地址；影响：本机所有网卡可访问开发服务。
  port: 8001 # 用途：设置 Gateway 端口；影响：前端开发代理转发到此端口。
  enable_docs: true # 用途：控制 OpenAPI 文档；影响：true 时可访问 /agent/docs。
  cors_origins: "http://localhost:5273,http://127.0.0.1:5273" # 用途：限定浏览器跨域来源；影响：仅列出的开发前端可携带 Authorization 调用。

database:
  backend: "sqlite" # 用途：选择 PixelFlow 持久化后端；影响：开发环境使用本地 SQLite。
  sqlite_dir: "../.pixelflow/dev-data" # 用途：设置 SQLite 数据目录；影响：新建数据库文件落在该目录。
  url: "" # 用途：可选覆盖完整数据库 URL；影响：留空时根据 sqlite_dir 自动生成。
  echo_sql: false # 用途：控制 SQL 调试日志；影响：true 会输出 SQL，建议仅临时排障使用。
  pool_size: 5 # 用途：设置非 SQLite 连接池基础大小；影响：仅 PostgreSQL 后端生效。

harness:
  sidecar_base_url: "" # 用途：配置 Linux Sidecar HTTPS 地址；影响：留空时 Gateway 拒绝接收新 Harness Run。
  gateway_instance_id: "pixelflow-dev" # 用途：标识 Gateway 服务实例；影响：写入服务 JWT 审计 claim。
  request_timeout_seconds: 15 # 用途：限制 Gateway 调用 Sidecar 的等待秒数；影响：超时后关闭新 Run 准入。
  run_limit_profiles:
    video_interactive_v1:
      deadline_seconds: 300 # 用途：为多轮 Skill、检查、参数纠错和非计费规划预留墙钟时间；影响：超时后当前 Run 安全停止。
      max_model_steps: 24 # 用途：允许复杂视频规划在自主纠错后完成；影响：仍受 64 步平台硬上限约束。
      max_business_tools: 12 # 用途：允许读取、规划和编辑串行组合；影响：仍受 32 次平台硬上限约束。
      max_billable_batch_starts: 1 # 用途：限制本 Run 可启动计费批次；影响：M5 计费 Tool 最多一次。
    confirmation_resume_v1:
      deadline_seconds: 150 # 用途：限制用户确认后的恢复 Run 秒数；影响：确认不会延长模型循环。
      max_model_steps: 10 # 用途：限制确认恢复的模型轮次；影响：达到上限后安全收口。
      max_business_tools: 5 # 用途：限制确认恢复的业务 Tool 数；影响：防止确认后无限编排。
      max_billable_batch_starts: 1 # 用途：限制确认恢复可启动的计费批次；影响：一次确认最多启动一批。
    run_recovery_v1:
      deadline_seconds: 90 # 用途：限制崩溃恢复 Run 秒数；影响：恢复只核对权威状态。
      max_model_steps: 6 # 用途：限制崩溃恢复的模型轮次；影响：避免恢复时扩张工作流。
      max_business_tools: 3 # 用途：限制崩溃恢复的 Tool 数；影响：仅允许必要的安全检查。
      max_billable_batch_starts: 0 # 用途：禁止崩溃恢复自动计费；影响：必须由新 Turn 或 M5 触发。

pixelflow:
  mysql_url: "" # 用途：可选兼容 MySQL 任务库 URL；影响：留空时使用 database 配置。
  long_term_memory_enabled: true # 用途：控制长期记忆读写；影响：false 时主流程继续但不访问 Mem0。
  volcengine_mem0_base_url: "" # 用途：配置 Mem0 HTTPS 地址；影响：留空时记忆服务 fail-open。
  volcengine_mem0_api_key: "" # 用途：预留 Mem0 密钥字段；影响：必须由环境变量注入，YAML 永远不保存真实值。
  long_term_memory_timeout_seconds: 3 # 用途：限制 Mem0 同步检索秒数；影响：超时返回空投影而不阻断 Run。
  long_term_memory_search_limit: 5 # 用途：限制单次记忆条数；影响：调大增加上下文消耗。
  jianying_draft_enabled: false # 用途：控制已下线视频交付 Provider；影响：保持 false，旧草稿能力不再启动。
  content_app_internal_upload_enabled: false # 用途：控制内部上传兼容开关；影响：保持 false，避免旧 Provider 任务恢复。

content_app:
  base_url: "https://test-video.borgrise.com/api" # 用途：配置本地开发使用的 content-app API 根地址，必须含 /api；影响：生图/生视频会直接拼接 /picture/* 与 /video/*，漏写 /api 会打到站点 HTML。
  remote_verify_enabled: true # 用途：控制远端 Authorization 校验；影响：true 时每个受保护请求校验用户登录态。
  verify_timeout_seconds: 10 # 用途：限制登录态校验秒数；影响：超时拒绝受保护请求。
  skip_ssl_verify: false # 用途：控制 TLS 证书校验；影响：false 要求服务端证书可信。

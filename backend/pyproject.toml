[project]
# 用途：声明 Gateway Python 分发名称；影响：仅影响构建与依赖解析标识。
name = "pixelflow"
# 用途：标识当前内部版本；影响：升级时需要同步锁文件与部署镜像标签。
version = "0.1.0"
# 用途：说明项目职责；影响：仅影响包元数据与开发者阅读。
description = "基于独立 Harness Sidecar 的电商内容创作 Agent 平台"
# 用途：指定项目说明文件；影响：构建发布时作为包元数据读取。
readme = "README.md"
# 用途：限定受支持的 Python 版本；影响：低版本解释器会拒绝安装。
requires-python = ">=3.12"
# 用途：声明 Gateway 运行依赖；影响：镜像与本地同步会安装这些库。
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.27",
    "sse-starlette>=2.1.0",
    "uvicorn[standard]>=0.34.0",
    "bcrypt>=4.0.0",
    "pyjwt>=2.9.0",
    "email-validator>=2.0.0",
    "asyncmy>=0.2.10",
    # 用途：为 PixelFlow 自有 SQLite Repository、Tool Ledger 和记忆 WriteOutbox 提供异步驱动；移除会使本地/CI SQLite 验证和默认 SQLite 运行时启动失败。
    "aiosqlite>=0.22.1",
    "mem0ai>=2.0.19",
]

[dependency-groups]
# 用途：声明仅开发使用的依赖组；影响：生产镜像不应依赖这些测试工具。
dev = [
    "blockbuster>=1.5.26,<1.6",
    "prompt-toolkit>=3.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.11",
]

[tool.pytest.ini_options]
# 用途：声明 pytest 默认参数；影响：不再保留旧工作流隔离标记，全部已注册测试均会参与默认收口验证。
addopts = []
# 用途：声明项目测试标记；影响：调用方可按标记选择真实外部环境用例。
markers = [
    "no_auto_user: disable the conftest autouse contextvar fixture for this test",
    "allow_blocking_io: opt out of the strict Blockbuster gate in tests/blocking_io/",
    "m0_real: 调用真实 Sidecar、DeepSeek 模型与 Gateway Tool Broker 的 M0 纵向测试",
    "m4_real: 调用真实模型自主多步非计费 Tool、双流事件与 Gateway SSE 的 M4 验收测试",
    "mem0_real: 调用隔离 Volcengine Mem0 环境的长期记忆验证",
]

[tool.uv]
# 用途：指定依赖索引地址；影响：uv 同步会从该源解析公开依赖。
index-url = "https://pypi.org/simple"
